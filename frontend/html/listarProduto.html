<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
    <meta name="description" content="Consulte os veículos disponíveis no AutoShopping.">
    <title>Veículos | AutoShopping</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/prgListarProduto.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-conteudo">
            <a class="logo" href="../index.html" aria-label="AutoShopping - Início">
                <img src="../imagens/autoshopping_logo.png" alt="AutoShopping">
            </a>

            <nav class="menu" aria-label="Navegação principal">
                <a href="../index.html">Início</a>
                <a class="ativo" href="listarProduto.html">Veículos</a>
                <a href="#categorias">Categorias</a>
                <a href="admin.html" id="linkAdmin" hidden>Painel</a>
                <a href="meusPedidos.html" id="linkPedidos" hidden>Pedidos</a>
                <a href="carrinho.html">Carrinho <span id="contadorCarrinho" class="contador-carrinho">0</span></a>
                <a id="linkConta" class="botao botao-contorno botao-menor" href="login.html">Entrar</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="banner-catalogo" aria-label="Catálogo AutoShopping">
            <h1 class="apenas-leitor">Catálogo de veículos AutoShopping</h1>
            <img src="../imagens/banner_catalogo.png" alt="Banner do catálogo AutoShopping com veículos em Florianópolis">
        </section>

        <section class="secao catalogo">
            <div class="container">
                <div class="painel-filtros">
                    <form id="formBusca" class="form-busca">
                        <label for="campoBusca">O que você procura?</label>
                        <div class="linha-busca">
                            <input id="campoBusca" type="search" placeholder="Nome, marca ou modelo">
                            <button class="botao botao-primario" type="submit">Buscar</button>
                        </div>
                    </form>

                    <div id="categorias" class="grupo-categorias">
                        <span class="titulo-filtro">Categoria</span>
                        <div id="filtroCategorias" class="filtros-categoria" aria-label="Filtrar por categoria">
                            <button class="filtro-categoria ativo" type="button" data-categoria="">Todos</button>
                        </div>
                    </div>
                </div>

                <div class="barra-resultados">
                    <h2>Resultados</h2>
                    <span id="contadorResultados">Carregando...</span>
                </div>

                <div id="mensagemLista" class="mensagem carregando" role="status">Carregando veículos...</div>
                <div id="listaProdutos" class="grade-veiculos" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="container rodape-conteudo">
            <img class="logo-rodape" src="../imagens/autoshopping_logo.png" alt="AutoShopping">
            <p>Marketplace automotivo acadêmico.</p>
            <p class="selo-copyright">Desenvolvido por <strong>Matheus Orsi Reis</strong></p>
        </div>
    </footer>
</body>
</html>
