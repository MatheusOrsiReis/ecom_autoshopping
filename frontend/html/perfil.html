<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | AutoShopping</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/prgPerfil.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-conteudo">
            <a class="logo" href="../index.html"><img src="../autoshopping_logo.png" alt="AutoShopping"></a>
            <nav class="menu" aria-label="Navegação principal">
                <a href="../index.html">Início</a>
                <a href="listarProduto.html">Veículos</a>
                <a href="admin.html" id="linkAdmin" hidden>Painel</a>
                <a href="meusPedidos.html">Pedidos</a>
                <a href="carrinho.html">Carrinho <span id="contadorCarrinho" class="contador-carrinho">0</span></a>
                <button id="botaoSair" class="botao botao-contorno botao-menor" type="button">Sair</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="topo-pagina">
            <div class="container">
                <span class="sobretitulo">Minha conta</span>
                <h1>Meu perfil</h1>
                <p>Consulte e mantenha seus dados atualizados.</p>
            </div>
        </section>

        <section class="secao">
            <div class="container area-cliente-layout">
                <nav class="menu-conta" aria-label="Menu da conta">
                    <a class="ativo" href="perfil.html">Dados pessoais</a>
                    <a href="meusPedidos.html">Meus pedidos</a>
                    <a href="admin.html" id="linkAdminConta" hidden>Painel administrativo</a>
                </nav>

                <section class="cartao-formulario">
                    <div class="cabecalho-formulario">
                        <h2>Dados pessoais</h2>
                        <p>Deixe o campo de senha vazio para mantê-la.</p>
                    </div>

                    <div id="carregandoPerfil" class="mensagem carregando">Carregando perfil...</div>
                    <form id="formPerfil" class="formulario" hidden>
                        <div class="campo campo-largo"><label for="nome">Nome completo</label><input id="nome" type="text" maxlength="80" required></div>
                        <div class="campo"><label for="cpf">CPF</label><input id="cpf" type="text" maxlength="14" required></div>
                        <div class="campo"><label for="telefone">Telefone</label><input id="telefone" type="tel" maxlength="20" required></div>
                        <div class="campo campo-largo"><label for="email">E-mail</label><input id="email" type="email" maxlength="100" required></div>
                        <div class="campo campo-largo"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="6" autocomplete="new-password"></div>
                        <div class="campo"><label for="cep">CEP</label><input id="cep" type="text" maxlength="9" required></div>
                        <div class="campo"><label for="uf">UF</label><input id="uf" type="text" maxlength="2" required></div>
                        <div class="campo campo-largo"><label for="rua">Rua</label><input id="rua" type="text" maxlength="100" required></div>
                        <div class="campo"><label for="numero">Número</label><input id="numero" type="text" maxlength="12" required></div>
                        <div class="campo"><label for="bairro">Bairro</label><input id="bairro" type="text" maxlength="70" required></div>
                        <div class="campo campo-largo"><label for="cidade">Cidade</label><input id="cidade" type="text" maxlength="70" required></div>
                        <p id="mensagemPerfil" class="mensagem-formulario campo-largo" role="status"></p>
                        <button id="botaoSalvarPerfil" class="botao botao-primario campo-largo" type="submit">Salvar alterações</button>
                    </form>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
